l_simp_chinese:
 universal_investment_survey_activity: "投资考察"
 universal_investment_survey_activity_desc: "在疆域内外考察潜在的地块,投资在任何空男爵领上建造城堡。建成后城堡归当地伯爵所有,而你成为股东,每年收取分红。"
 universal_investment_survey_activity_host_desc: "$BULLET_WITH_TAB$可在地图上考察任意空男爵领,无论自己领地还是外国\n$BULLET_WITH_TAB$支付阶梯递增的建造成本并动工\n$BULLET_WITH_TAB$建成后成为股东,每年收取年金\n$BULLET_WITH_TAB$注意:没有法律保护,年金可能被拒付或没收"
 universal_investment_survey_activity_province_desc: "在[ROOT.Province.GetName]的空地上投资建城"
 universal_investment_survey_activity_province_desc_risky: "在[ROOT.Province.GetName]投资——当地伯爵对你怀有敌意,这笔投资风险很高"
 universal_investment_survey_activity_conclusion_desc: "地块已经考察完毕。剩下的事交给工匠们吧——该回家了。"
 universal_investment_survey_activity_selection_tooltip: "考察一处地点并开始建造城堡\n\n预期回报:已建成投资的年度分红"
 universal_investment_survey_activity_destination_selection: "你可以在任何空男爵领投资,无论是自己的疆域还是异国他乡。当心敌对的统治者——他们可能把你的投资变成负担。"
 universal_investment_survey_activity_predicted_cost: "差旅费固定不变。建造成本在抵达现场时支付,且随投资次数逐次递增。"
 phase_univ_invest_survey: "实地考察"
 phase_univ_invest_survey_desc: "前往选定的地块,破土动工,剩下的交给工匠们。"
 universal_investment_survey_activity_name: "投资考察"
 universal_investment_survey_activity_owner: "投资考察"
 universal_investment_survey_activity_guest_desc: ""
 universal_investment_survey_activity_guest_help_text: "本活动无需宾客。"
 TRAVEL_NAME_FOR_universal_investment_survey_activity: "投资考察"

 universal_investment.0001.t: "考察完毕"
 universal_investment.0001.desc: "你站在一片空旷的土地上。决断的时刻到了:押上你的金币,在这里竖起一座城堡,还是让这片土地继续沉默?\n\n建成后城堡将归当地伯爵所有——除非这是你自己的领地——而你将成为股东,每年收取分红。"
 universal_investment.0001.a: "破土动工!(支付建造成本)"
 universal_investment.0001.a.tt: "扣除建造成本(随投资次数递增)并开始施工\n\n未经允许擅自建城会惹恼当地伯爵"
 universal_investment.0001.b: "此地不宜。打道回府。"

 universal_investment.0002.t: "当地伯爵上门索偿"
 universal_investment.0002.desc: "工匠们刚刚扎好营,这片土地的伯爵就带着武装人员赶到了。他们对你不请自来地动工非常不满。\n\n\"要么为你的越界赔偿,要么停工——用什么方式,由我们决定。\""
 universal_investment.0002.a: "支付补偿金(建造成本的一半)"
 universal_investment.0002.b: "拒不妥协。让他们来试试"
 universal_investment.0002.c: "接受没收。这笔投资作废"

 universal_investment.0003.t: "工地遭遇变故"
 universal_investment.0003.desc: "灾难降临工地:仓库失火,没被烧毁的物资又被强盗劫掠一空。工匠们正等你拿主意。"
 universal_investment.0003.a: "修复工地(建造成本的四分之一)"
 universal_investment.0003.b: "放弃工地。这笔投资作废"

 universal_investment.0004.t: "城堡落成"
 universal_investment.0004.desc: "你的城堡完工了。它矗立在地平线上,成为你的金币与远见的纪念碑。\n\n城堡归当地伯爵所有,而你已成为股东——只要当地统治者守信,每年都会有分红流入你的金库。"
 universal_investment.0004.a: "一笔好投资。"

 universal_investment.0006.t: "伯爵拒付年金"
 universal_investment.0006.desc: "这片土地的新伯爵派人送来口信:他们不承认你对城堡收入的分成权。你的分红被扣下了。\n\n法律站在他们那边——但你还有金币、声望和耐心。"
 universal_investment.0006.a: "谈判(当年租金减半)"
 universal_investment.0006.b: "贿赂他们(100 金,收全租金)"
 universal_investment.0006.c: "威胁他们"
 universal_investment.0006.d: "及时止损。就此放手"

 universal_investment.0007.t: "年度投资报告"
 universal_investment.0007.desc: "你的投资组合交出了本年度的成绩单:分红已经到账,如有损失也已核销。\n\n遍布各地的城堡网络,既是远见的证明,也是稳定的收入来源。"
 universal_investment.0007.a: "生意就是生意。"

 universal_investment.0008.t: "三座城堡落成"
 universal_investment.0008.desc: "三座城堡拔地而起,每一座都由你的金币铸成。市井间开始传颂你的名字:建造者、金主、有远见的人。\n\n+500 威望"
 universal_investment.0008.a: "世界正因我而改变。"

 universal_investment.0009.t: "五座城堡落成"
 universal_investment.0009.desc: "五座城堡。你的财富已然成为风景的一部分。游吟诗人开始传唱你的故事——人们称你为"城建者"。\n\n+1500 威望。你获得称号"城建者"。"
 universal_investment.0009.a: "让他们唱吧。"

 universal_investment.0010.t: "十座城堡落成"
 universal_investment.0010.desc: "十座城堡遍布各地——这份产业让任何王侯都不敢小觑。你的金币重塑了地图本身。当初的豪赌,如今已成石头的王朝。\n\n+3000 威望"
 universal_investment.0010.a: "石头记得人类遗忘的事。"
