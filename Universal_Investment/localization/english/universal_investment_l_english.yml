l_english:
 universal_investment_survey_activity: "Investment Survey"
 universal_investment_survey_activity_desc: "Survey potential sites across the realm and beyond, and invest in a castle to be built on any empty barony. Once completed, the castle belongs to the local count, and you become a shareholder collecting annual dividends."
 universal_investment_survey_activity_host_desc: "$BULLET_WITH_TAB$Survey any empty barony on the map, in your own realm or foreign lands\n$BULLET_WITH_TAB$Pay an escalating construction cost and start a castle\n$BULLET_WITH_TAB$Once completed, you become a shareholder receiving annual dividends\n$BULLET_WITH_TAB$Watch out: without legal protection, dividends may be withheld or seized"
 universal_investment_survey_activity_province_desc: "Invest in an empty barony in [ROOT.Province.GetName]"
 universal_investment_survey_activity_province_desc_risky: "Invest in [ROOT.Province.GetName] - the local count holds a grudge against you, and this investment will be risky"
 universal_investment_survey_activity_conclusion_desc: "The site has been inspected. The builders can take it from here - it is time to return home."
 universal_investment_survey_activity_selection_tooltip: "Survey a location and start building a castle\n\nAnticipated Rewards: dividends from completed investments"
 universal_investment_survey_activity_destination_selection: "You may invest in any empty barony, in your own realm or abroad. Be wary of hostile rulers - they may turn your investment into a liability."
 universal_investment_survey_activity_predicted_cost: "The travel fee is fixed. The construction cost itself is paid upon arrival and escalates with each investment you make."
 phase_univ_invest_survey: "Site Survey"
 phase_univ_invest_survey_desc: "Travel to the chosen site, break ground, and let the builders take it from there."
 universal_investment_survey_activity_name: "Investment Survey"
 universal_investment_survey_activity_owner: "Investment Survey"
 universal_investment_survey_activity_guest_desc: ""
 universal_investment_survey_activity_guest_help_text: "This activity does not require guests."
 TRAVEL_NAME_FOR_universal_investment_survey_activity: "Investment Survey"

 universal_investment.0001.t: "Survey Complete"
 universal_investment.0001.desc: "You stand on a stretch of empty land. This is the moment of decision: stake your gold and raise a castle here, or leave the land to the wind.\n\nOnce completed, the castle will belong to the local count - unless this is your own land - and you will become a shareholder collecting annual dividends."
 universal_investment.0001.a: "Break ground! (Pay the construction cost)"
 universal_investment.0001.a.tt: "Deducts the construction cost (increases with each investment) and begins construction\n\nThe local count will be displeased if you build uninvited"
 universal_investment.0001.b: "This place is not right. Return home."

 universal_investment.0002.t: "The Local Count Demands Payment"
 universal_investment.0002.desc: "Your builders have barely set up camp when the count of this land arrives with armed men. They are not happy that you started building without permission.\n\n\"You will compensate us for this trespass, or construction stops - one way or another.\""
 universal_investment.0002.a: "Pay the compensation (half the construction cost)"
 universal_investment.0002.b: "Refuse. Let them try to stop us"
 universal_investment.0002.c: "Accept the confiscation. The investment is lost"

 universal_investment.0003.t: "Misfortune at the Construction Site"
 universal_investment.0003.desc: "Disaster has struck the construction site: a fire broke out in the storehouses, and what was not burned was plundered by brigands. Your builders are asking what to do."
 universal_investment.0003.a: "Repair the damage (a quarter of the construction cost)"
 universal_investment.0003.b: "Abandon the site. The investment is lost"

 universal_investment.0004.t: "Construction Completed"
 universal_investment.0004.desc: "Your castle is finished. It stands proudly on the horizon, a monument to your gold and vision.\n\nThe castle belongs to the local count, and you are now a shareholder - annual dividends will flow to your treasury as long as the local ruler honors the arrangement."
 universal_investment.0004.a: "A fine investment."

 universal_investment.0006.t: "The Count Refuses to Pay"
 universal_investment.0006.desc: "The new count of the land has sent a messenger: they do not recognize your claim to a share of the castle's income. Your dividends are withheld.\n\nThe law is on their side - but so is your gold, your reputation, and your patience."
 universal_investment.0006.a: "Negotiate (half this year's rent)"
 universal_investment.0006.b: "Bribe them (100 gold, full rent)"
 universal_investment.0006.c: "Threaten them"
 universal_investment.0006.d: "Cut your losses. Walk away"

 universal_investment.0007.t: "Annual Investment Report"
 universal_investment.0007.desc: "Your investment portfolio has yielded its annual results. Dividends have been collected, and losses, if any, have been written off.\n\nYour network of castles across the realm stands as a testament to your vision - and a source of steady income."
 universal_investment.0007.a: "Business is business."

 universal_investment.0008.t: "Three Castles Completed"
 universal_investment.0008.desc: "Three castles now rise from the land, each built with your gold. Your name is spoken in the marketplaces: a builder, a financier, a man of vision.\n\n+500 Prestige"
 universal_investment.0008.a: "The world takes shape around me."

 universal_investment.0009.t: "Five Castles Completed"
 universal_investment.0009.desc: "Five castles. Your fortune has quite literally become part of the landscape. Bards have begun to sing of you - and the people call you the City Builder.\n\n+1500 Prestige. You are granted the nickname 'the City Builder'."
 universal_investment.0009.a: "Let them sing."

 universal_investment.0010.t: "Ten Castles Completed"
 universal_investment.0010.desc: "Ten castles across the realm - a portfolio no prince can ignore. Your gold has shaped the map itself. What began as a gamble is now a dynasty of stone.\n\n+3000 Prestige"
 universal_investment.0010.a: "Stone remembers what men forget."
