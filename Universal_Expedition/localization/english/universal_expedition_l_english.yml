l_english:
 universal_expedition_decision: "Universal Great Expedition"
 universal_expedition_decision_desc: "Spend the wealth of a realm to launch a great holy war bound by no doctrine or era — the target kingdom is chosen by military counsel.\n\nThe faithful gather as one: rulers of the faith pledge their arms and lords donate gold to the war chest. When preparations are complete, war is declared.\n\nOn victory, the kingdom and its lands are divided among the participants by contribution.\n\nRequires: King rank or higher, 2000 prestige, 2000 gold, 1000 piety and 50 military strength. Costs: 2000 prestige, 1000 gold, 1000 piety, plus 1000 gold to the war chest. May be launched only once in a lifetime."
 universal_expedition_decision_tooltip: "Launch a universal great holy war at a moderate cost. The target is chosen automatically; war begins after about a year of preparations. Rewards are granted by contribution. After launching, your religion is permanently unlocked into the Great Holy War era — the religious heads of your faith can then launch their own holy wars as per vanilla mechanics."
 universal_expedition_decision_confirm: "Declare the Great Holy War"
 universal_expedition_launched_title: "The Expedition Sets Forth"
 universal_expedition_launched_desc: "The target of the expedition has been chosen: [target_kingdom.GetBaseNameNoTier]. The realm of [target_character.GetTitledFirstName] will face a great holy war after a preparation period of roughly a year.\n\nRulers of the faith will pledge their arms and gold will flow into the war chest. When preparations are complete, war is declared automatically, and victory is rewarded by contribution.\n\nYour religion has been permanently unlocked into the Great Holy War era - its religious heads may now launch holy wars of their own when conditions allow. This decision may be taken only once in a lifetime."
 universal_expedition_launched_ok: "Very well"
