l_simp_chinese:
 # 中国867精锐兵种
 tiaodang: "跳荡兵"
 tiaodang_flavor: "#F 效仿神策军阵前的#italic 跳荡#!突击队，这些轻装敢死之士猛冲敌阵前锋，以令人胆寒的凶悍撕开披甲军阵。#!"
 changqiangdu: "长枪都"
 changqiangdu_flavor: "#F #italic 都#!是晚唐藩镇初兴的军制编制，由都将统率。这支纪律严明的长枪方阵如钢铁之墙立于阵前，任何骑兵冲锋都在枪林中化为屠戮。#!"
 shence_youqi: "神策游骑"
 shence_youqi_flavor: "#F 神策军中的#italic 游弈#!骑兵，这些轻装骑手穿行于两军之间侦察袭扰，是追击溃敌、截断退路的行家里手。#!"
 sheshengjun: "射生军"
 sheshengjun_flavor: "#F #italic 射生#!是神策军中的骑射能手，专精射术与驭马之胆。他们的箭雨足以撕裂散兵线，也能撕碎重装步兵。#!"
 # 日本867精锐兵种
 japan_sakimori_archers: "防人弓队"
 japan_sakimori_archers_flavor: "#F 西海道边防戍卒，依#italic 律令防人#!制度征发东国弓手，戍守对马、壹岐与九州西岸，以御新罗与大唐水师。山川海屿皆为坚垒。#!"
 japan_umaya_light_cavalry: "马寮轻骑"
 japan_umaya_light_cavalry_flavor: "#F 朝廷#italic 马寮#!掌天下马政，诸国牧场岁贡良驹。这些朝堂马政骑队平野奔袭如飞，是禁军之耳目、王师之鞭笞。#!"
 kondei: "健児队"
 kondei_flavor: "#F #italic 健児#!是律令制下从地方良家子弟中选拔的雄健之徒，自幼习射于山林。在森林与山径之间，他们的箭矢与机巧足以消磨任何来犯之敌。#!"
 tsuibushi_spearmen: "追捕使団"
 tsuibushi_spearmen_flavor: "#F #italic 追捕使#!奉国衙之命追捕盗贼、镇压蜂起，所辖枪队行于山林村陌之间，是律令治安的最后一道屏障。#!"
 rokuefu_guards: "六卫府兵"
 rokuefu_guards_flavor: "#F #italic 六卫府#!拱卫平安京——左右近卫、左右兵卫、左右卫门，皆天皇亲卫。衣甲鲜明，枪戟森列，朝廷威严之所在。#!"
 ainu_hunters: "阿伊努猎手队"
 ainu_hunters_flavor: "#F 北海道的#italic 阿伊努#!以渔猎为生，兽皮衣裘，长弓劲矢。他们在密林与雪原之间来去如风，是北国诸岛最难缠的猎手。#!"
 ryukyuan_archers: "琉球弓手"
 ryukyuan_archers_flavor: "#F 琉球列岛的岛民世代守御各自的山屿，弯弓善射。海雾与礁岸之间，他们的箭雨让任何登岛之敌寸步难行。#!"
 # 朝鲜半岛867精锐兵种
 hwarang: "花郎"
 hwarang_flavor: "#F #italic 花郎#!乃新罗之花朵，习剑、习枪、习礼乐的贵族少年。他们以炽烈的骄傲纵横沙场，堪称国之铁臂。#!"
 golpum_cavalry: "骨品马军"
 golpum_cavalry_flavor: "#F 新罗以#italic 骨品制#!定尊卑，真骨与六头品贵族子弟组成王廷骑队。佩剑持弓，驰骋于庆州原野，是花郎精神在马背上的延伸。#!"
 sechang: "誓幢军"
 sechang_flavor: "#F #italic 誓幢#!是新罗九誓幢的驻屯军。身披棉甲，扼守山丘与关隘，他们的枪墙让每一处谷道都化作堡垒。#!"
 nudang: "弩幢"
 nudang_flavor: "#F 新罗幢制中的#italic 弩幢#!，以强弩列阵于山岳关隘之间。箭雨从高处倾泻而下，令进攻者未至城下先折其锋。#!"
 kwanggun: "光军"
 kwanggun_flavor: "#F #italic 光军#!是高丽王廷的精锐禁军，聚国中壮士，号为王国之脊。他们在北境的征讨中令契丹铁骑也为之忌惮，是开国以来军功赫赫的常胜之师。#!"
 singi_riders: "神骑军"
 singi_riders_flavor: "#F 高丽#italic 神骑军#!以矫健善驰闻名，马匹自北境良马场选调。他们追亡逐北如影随形，溃阵之后便是其收割的时刻。#!"
 eungyang: "鹰扬军"
 eungyang_flavor: "#F #italic 鹰扬军#!位列高丽二军六卫之首，拱卫王都开京。甲胄鲜明，枪戟如林，是王朝中枢最可靠的长城。#!"
 obang_pikes: "五方军"
 obang_pikes_flavor: "#F 百济以#italic 五方#!统军——中、前、后、左、右方各置方领，分部而治。枪阵如林，承袭自泗沘时代的军制余绪，至今仍为百济遗民的武骨。#!"
 baekje_crossbowmen: "百济弩手"
 baekje_crossbowmen_flavor: "#F 百济以善弩著称，周留城下曾以连弩拒唐军于坚城之外。这些弩手承袭祖辈的技艺，箭雨之下，攻城云梯尽数折返。#!"
 baekje_armored_riders: "百济甲骑"
 baekje_armored_riders_flavor: "#F 武宁王陵的陶俑向世人昭示百济#italic 甲骑具装#!的荣光。人马披甲的精骑驰骋于平原沃野，是百济军阵中最后的锋刃。#!"
 # 南诏867精锐兵种
 luojuzi: "罗苴子"
 luojuzi_flavor: "#F #italic 罗苴子#!是南诏王的常备精锐，每年秋后从各部择雄勇者充任，负弓矢短矛，既为国王宿卫，又是南诏对唐山地战争中的尖刀。#!"
 mengshe_archers: "蒙舍弩手"
 mengshe_archers_flavor: "#F 南诏本名蒙舍诏，其部众以善弩著称。来自苍山梯田山地的弩手居高临下箭如雨下，在山道进攻成形之前便将其击溃。#!"
 baiman_spearmen: "白蛮枪军"
 baiman_spearmen_flavor: "#F #italic 白蛮#!是南诏境内务农定居的部族，他们结成严整的长枪方阵，为南诏军阵的中坚。梯田丘陵之上枪林如壁，钝化骑兵冲锋，掩护身后的弩手。#!"
 cangshan_ambushers: "苍山伏兵"
 cangshan_ambushers_flavor: "#F 生于云雾缭绕的苍山之巅，这些轻装伏兵熟知南方山地的每一道沟壑与兽径。他们自设伏处突起袭击，袭扰粮道，在反击成形前隐入迷雾。#!"
 # 中国北方867精锐兵种
 tangut_fanluo_riders: "蕃落骑"
 tangut_fanluo_riders_flavor: "#F #italic 蕃落#!是定居夏州边地的党项部落骑兵。骑乘自北境马市购得的骏马，以游骑技艺往来袭扰，在重兵阵列成形之前便消散无踪。#!"
 tangut_dingnan_spearmen: "定难枪军"
 tangut_dingnan_spearmen_flavor: "#F 党项拓跋部领有的#italic 定难军#!，以唐代军制编练藩镇步军。枪阵拱卫边镇阵线，是草原劫掠者面前的一道钢墙。#!"
 shatuo_yajun_riders: "鸦儿军"
 shatuo_yajun_riders_flavor: "#F 河东边地的沙陀部是晚唐最负盛名的精骑，其选锋#italic 鸦儿军#!全军黑衣，为北方军镇手中的恐怖兵器。迅捷、凶悍，对部酋忠心不二。#!"
 qiang_crossbows: "羌弩"
 qiang_crossbows_flavor: "#F 西方山区的羌部世代扼守关隘，抵御高原骑兵的进犯。他们的弩手在高谷稀薄的空气中历练，能在山道进攻成形之前将其击溃。#!"
 qiang_mountain_ambushers: "山道伏兵"
 qiang_mountain_ambushers_flavor: "#F 西方山系的峡谷与碎石坡上，羌人熟知每一处崖台与滑道。这些散兵扑击掉队者和辎重队，随即隐入马匹无法追及的绝壁之间。#!"
 # 东北867精锐兵种
 balhae_kushishi_archers: "楛矢弓手"
 balhae_kushishi_archers_flavor: "#F 渤海承肃慎#italic 楛矢石砮#!之遗风，弓矢精良冠绝海东。林海之间箭如雨注，五京十五府的山川皆为箭羽所覆。#!"
 balhae_riders: "渤海铁骑"
 balhae_riders_flavor: "#F 渤海王廷以靺鞨劲骑为爪牙，马政仿唐而养于塞上。林间驰突，平原奔袭，海东盛国的兵威系于这些骑士的马蹄之下。#!"
 balhae_wujing_spearmen: "五京军"
 balhae_wujing_spearmen_flavor: "#F 渤海效唐制设#italic 五京十五府#!，各京府驻军枪甲森然。上京龙泉府的精锐步军以长枪结阵，拱卫王都与诸京要地。#!"
 mohe_hunters: "靺鞨猎人"
 mohe_hunters_flavor: "#F 靺鞨诸部以渔猎为生，男丁自幼随父辈出没于林雪之间。他们的箭矢与兽径之谋，让侵入白山黑水的敌人在密林深处失其踪迹。#!"
 mohe_warriors: "靺鞨劲卒"
 mohe_warriors_flavor: "#F 《隋书》称靺鞨#italic 人皆劲健#!。这些壮士披重革、负刀矛，于林间近战悍不畏死，是东北林海中最凶悍的步卒。#!"
 goguryeo_horse_archers: "高句丽弓骑"
 goguryeo_horse_archers_flavor: "#F 承袭高句丽骑射传统的骑士，其马上箭术曾令三国大军为之震惊。他们先是远远地以箭雨覆盖敌军，继而纵马近身取命。#!"
 goguryeo_armored_infantry: "高句丽甲士"
 goguryeo_armored_infantry_flavor: "#F 高句丽的山城与坚垒曾抵御百万隋唐之师，其甲士身披重铠、执长兵，是丸都、平壤旧制下最后的武骨。#!"
 jurchen_heavy_infantry: "女真精甲"
 jurchen_heavy_infantry_flavor: "#F 营州女真诸部虽小，其精甲勇士却已展露猛安谋克的雏形。重甲结阵，林间进退有度，是东北诸部中崛起之兆。#!"
 # 中国南方867精锐兵种
 viet_crossbowmen: "交趾弩手"
 viet_crossbowmen_flavor: "#F 红河稻原之上，安南都护府以唐制编练军旅。这些交趾弩手自堤堰与竹林间射出严整的箭雨，是南方边防的中坚。#!"
 viet_spear_pikes: "安南枪阵"
 viet_spear_pikes_flavor: "#F 静海军步卒在南方河原上结成枪墙，屹立于稻田与堤堰之间。齐整的枪林钝化高地劫掠者的冲击，掩护身后的弩阵。#!"
 hlai_cave_archers: "黎峒弓手"
 hlai_cave_archers_flavor: "#F 海南岛的黎民聚居于内地山峒与密林之中。他们的弓手深谙狩猎与伏击之道，世代守卫故土的山道关隘。#!"
 tai_rattan_warriors: "藤甲兵"
 tai_rattan_warriors_flavor: "#F 南方河谷的傣部编织藤甲为衣，轻而柔韧。这些散兵借藤甲之便穿行丛林，在竹影藤蔓间一击即隐。#!"
 bouxcuengh_crossbowmen: "僚人弩手"
 bouxcuengh_crossbowmen_flavor: "#F 桂西山地的俚僚部众善用弩机，熟知故地每一处崖壁与沟壑。高处设伏令入侵者流血不止，喀斯特山垒吞没一切追兵。#!"
 hmong_poison_archers: "毒弩手"
 hmong_poison_archers_flavor: "#F 云岭高原的苗部以淬毒弩箭闻名，箭簇浸过南方密林的毒汁，擦伤即足以致命。他们的远射足以在远处瓦解对山垒的围攻。#!"
 yao_mountain_hunters: "山猎手"
 yao_mountain_hunters_flavor: "#F 南方山系的瑶民以狩猎为生，子弟生而为散兵。他们自山脊扑击营帐与行伍，群峰之间无追兵可及。#!"
 # 西藏867精锐兵种
 snowfield_archers: "雪域弓手"
 snowfield_archers_flavor: "#F 冰川高原上的射手，弯起短小的柳叶弓，在足以让低地人喘不过气的稀薄空气中放箭。雪原清冽的天地间，他们的箭矢在半里之外就能索命。#!"
 highland_ambushers: "深山伏戎"
 highland_ambushers_flavor: "#F 峡谷深处的刚毅子弟，自幼熟稔山间隐径。伏击而后隐遁，突袭而后消失——此即其道，任何入侵之军都无法沾染高原要隘的衣角。#!"
 plateau_horsemen: "高原马军"
 plateau_horsemen_flavor: "#F 吐蕃#italic 五茹#!之制，各茹皆置马军。这些生于高寒牧场的骑士跨乘矮壮耐寒的吐蕃马，于山原之间骤起骤没，是赞普余威的奔雷。#!"
 zhangzhung_riders: "象雄穹骑"
 zhangzhung_riders_flavor: "#F 阿里古邦象雄以畜牧立国，穹隆银城之民善骑。这些高原游骑往来于冈底斯山麓，守护着本教圣地最后的荣光。#!"
 sumpa_women_warriors: "苏毗女军"
 sumpa_women_warriors_flavor: "#F 《隋书》言东女国#italic 贵女子，轻丈夫#!。苏毗以女为王，其部曲中不乏骁勇的女战士，持弓负盾，出没于那曲草原与山谷之间。#!"
 tsangpa_spearmen: "后藏枪军"
 tsangpa_spearmen_flavor: "#F 后藏庄园林立，部曲农兵以长枪结阵，护其庄堡与田园。枪阵立于山隘之前，一如往昔抵御北来的游牧劫掠。#!"
 kirati_hunters: "基拉蒂猎手"
 kirati_hunters_flavor: "#F 喜马拉雅南麓的基拉蒂山民世代以猎为生，踏足云端之险。他们在崇山峻岭间设伏放箭，令翻越关隘的敌师寸步难行。#!"
 lhomon_archers: "珞门弓手"
 lhomon_archers_flavor: "#F 珞瑜与门隅的山地部民持弓守御其隘口，世代如此。密林与危崖之间，他们的箭矢是外人窥伺这片土地时最先领略的问候。#!"
