l_english:
 # China 867 Elite MaA
 tiaodang: "Tiaodang Shock Troops"
 tiaodang_flavor: "#F Modeled on the #italic Tiaodang#! assault squads of the Shence Army, these lightly armored daredevils hurl themselves at the enemy vanguard, disrupting armorclad ranks with startling savagery.#!"
 changqiangdu: "Changqiangdu Spearmen"
 changqiangdu_flavor: "#F The #italic du#! were the nascent banner units of the late Tang fanzhen armies, led by a dutou. These disciplined long-spear formations stand as a wall of steel against any cavalry charge, their serried ranks turning horse raids into butcheries.#!"
 shence_youqi: "Shence Youqi Scouts"
 shence_youqi_flavor: "#F Roving riders of the imperial #italic Shence#! Army, these lightly armored horsemen range between the armies to probe and harry the foe, and are masters of running down a broken enemy and cutting off his retreat.#!"
 sheshengjun: "Shesheng Horse Archers"
 sheshengjun_flavor: "#F The #italic Shesheng#! were the mounted marksmen of the imperial Shence Army, chosen for their skill at shooting and their nerve in the saddle. Their arrow storms shred skirmisher lines and heavy infantry alike.#!"
 # Japan 867 Elite MaA
 japan_sakimori_archers: "Sakimori Archers"
 japan_sakimori_archers_flavor: "#F Frontier guards of the western sea road, raised under the #italic ritsuryo Sakimori#! system from the archers of the eastern provinces. They hold Tsushima, Iki and the Kyushu shore against the fleets of Silla and Tang - every mountain and island a fortress.#!"
 japan_umaya_light_cavalry: "Umaya Light Cavalry"
 japan_umaya_light_cavalry_flavor: "#F The #italic Umaya#! of the court govern the horse affairs of the realm, and the imperial studs offer up their best steeds each year. These palace riding squadrons cross the open fields like the wind - the eyes of the guard, the whip of the royal host.#!"
 kondei: "Kondei"
 kondei_flavor: "#F The #italic Kondei#! were the picked stalwarts of the ritsuryo system, chosen from the sturdy households of the provinces and trained from childhood in the mountain forests. Among the woods and hill paths their arrows and cunning wear down any invader.#!"
 tsuibushi_spearmen: "Tsuibushi Spears"
 tsuibushi_spearmen_flavor: "#F Envoys of the #italic Tsuibushi#! office hunt down brigands and quell uprisings by order of the provincial headquarters. Their spear bands move through forest and field, the last bulwark of ritsuryo law and order.#!"
 rokuefu_guards: "Rokuefu Guards"
 rokuefu_guards_flavor: "#F The #italic Six Guard Bureaus#! defend Heian-kyo - the Left and Right Inner Guards, the Palace Guards and the Gate Guards, all personal guardsmen of the Emperor. Bright-armored with spears in serried ranks, they embody the majesty of the court.#!"
 ainu_hunters: "Ainu Hunter Bands"
 ainu_hunters_flavor: "#F The #italic Ainu#! of Hokkaido live by the hunt and the catch, clad in furs, armed with longbows and heavy arrows. They move like the wind between forest and snowfield, the most elusive hunters of the northern isles.#!"
 ryukyuan_archers: "Ryukyuan Archers"
 ryukyuan_archers_flavor: "#F The islanders of the Ryukyu chain have defended their scattered isles since time immemorial, skilled with the bow. Amid sea mist and reef-laced shores, their arrow storms make landing a foe a slow and bloody business.#!"
 # Korea 867 Elite MaA
 hwarang: "Hwarang"
 hwarang_flavor: "#F The #italic Hwarang#!, the Flower Knights of Silla, are noble youths trained in sword, spear and ritual. They carry a burning pride onto every field, and are the iron arm of the kingdom.#!"
 golpum_cavalry: "Golpum Cavalry"
 golpum_cavalry_flavor: "#F Silla's #italic golpum bone-rank#! system sets the noble orders, and the youths of the True Bone and Sixth Head ranks ride in the royal cavalry. Sword and bow in hand, they sweep the plains around Gyeongju - the spirit of the Hwarang carried on horseback.#!"
 sechang: "Sechang Garrison"
 sechang_flavor: "#F The #italic Sechang#! are the garrison troops of Silla's Nine Sechang banners. Clad in padded armor and holding the hills and passes, their spear walls turn every valley road into a fortress.#!"
 nudang: "Nudang Crossbow Corps"
 nudang_flavor: "#F The #italic Nudang#! were the crossbow corps of the Silla banner system, arraying their heavy bows along the mountain passes. Their volleys pour down from the heights and break the assault before the walls are reached.#!"
 kwanggun: "Gwanggun Guard"
 kwanggun_flavor: "#F The #italic Gwanggun#! are the elite guard of the Goryeo court, gathered from the strongest men of the realm, the very spine of the kingdom. On the northern expeditions they won dread respect even from the Khitan riders.#!"
 singi_riders: "Singi Riders"
 singi_riders_flavor: "#F The #italic Singi#! cavalry of Goryeo are famed for their swift riding, their mounts drawn from the finest northern studs. They run down broken hosts like a shadow, and the rout is their harvest time.#!"
 eungyang: "Eungyang Guard"
 eungyang_flavor: "#F First among the Two Armies and Six Guards of Goryeo, the #italic Eungyang#! defend the royal city of Gaegyeong. Bright-armored and spear-laden, they are the most reliable wall of the dynasty's heartland.#!"
 obang_pikes: "Obang Pikes"
 obang_pikes_flavor: "#F Baekje mustered its armies by the #italic five directions#! - center, front, rear, left and right - each under its own commander. The spear woods of this old Sabi-era system remain the martial backbone of the Baekje remnant.#!"
 baekje_crossbowmen: "Baekje Crossbowmen"
 baekje_crossbowmen_flavor: "#F Baekje was famed for its crossbows, and at the walls of Juryu a storm of bolts once held the Tang host at bay. These marksmen keep their forefathers' craft, and their volleys break the ladders before they reach the walls.#!"
 baekje_armored_riders: "Baekje Armored Riders"
 baekje_armored_riders_flavor: "#F The tomb figurines of King Muryeong still bear witness to the glory of Baekje's #italic armored cataphract#! riders. Horse and man in mail, they sweep across the open fields as the last blade of the Baekje host.#!"
 # Nanzhao 867 Elite MaA
 luojuzi: "Luojuzi Guard"
 luojuzi_flavor: "#F The #italic Luojuzi#! were the standing elite of the Nanzhao kings, chosen each year from the bravest of the southern tribes. Bearing bow, arrow and short spear, they fought as the royal bodyguard and the spearhead of Nanzhao armies in the mountain wars against Tang China.#!"
 mengshe_archers: "Mengshe Crossbowmen"
 mengshe_archers_flavor: "#F The Nanzhao kingdom took its name from the Mengshe Zhao, and its tribes were famed for the crossbow. From the terraced hills of Cangshan these marksmen pour bolts into enemy ranks, breaking assaults on the mountain roads before they begin.#!"
 baiman_spearmen: "Baiman Spearmen"
 baiman_spearmen_flavor: "#F The #italic Baiman#!, the settled White Barbarian households of Nanzhao, muster in serried spear formations that anchor the kingdom's battle lines. Steadfast on the terraced hills, their walls of pikes blunt cavalry and shield the crossbowmen behind them.#!"
 cangshan_ambushers: "Cangshan Ambushers"
 cangshan_ambushers_flavor: "#F Born on the cloud-wrapped heights of Cangshan, these light skirmishers know every ravine and game trail of the southern mountains. They strike from ambush, harry supply columns, and fade back into the mist before a counterattack can form.#!"
 # North China 867 Elite MaA
 tangut_fanluo_riders: "Fanluo Riders"
 tangut_fanluo_riders_flavor: "#F The #italic Fanluo#! were the tribal horsemen of the Tangut clans settled in the Xiazhou marches of the Tang fanzhen order. Riding ponies from the horse markets of the northern border, they raid with a horseman's craft, melting away before heavy columns can form.#!"
 tangut_dingnan_spearmen: "Dingnan Spearmen"
 tangut_dingnan_spearmen_flavor: "#F The Dingnan Army, the fanzhen of the Tangut Tuoba clan at Xiazhou, mustered infantry in the Tang style. Their spear ranks anchor the frontier lines, a wall of steel before the raiders of the steppe.#!"
 shatuo_yajun_riders: "Yajun Riders"
 shatuo_yajun_riders_flavor: "#F The Shatuo of the Hedong frontier were famed as the finest horsemen in the late Tang service, and their picked riders - all clad in black, the #italic Yajun#! - struck as the terror weapon of the northern commanderies. Swift, cruel, and utterly loyal to their chieftains.#!"
 qiang_crossbows: "Qiang Crossbowmen"
 qiang_crossbows_flavor: "#F The Qiang tribes of the western mountains have held their passes for centuries against the horsemen of the plateau. Their crossbowmen, hardened by the thin air of the high valleys, break assaults on the mountain roads before they begin.#!"
 qiang_mountain_ambushers: "Mountain Ambushers"
 qiang_mountain_ambushers_flavor: "#F In the gorges and screes of the western ranges, the Qiang know every ledge and slide. These skirmishers descend on stragglers and supply trains, then vanish into the heights where no horse can follow.#!"
 # Northeast 867 Elite MaA
 balhae_kushishi_archers: "Kushishi Archers"
 balhae_kushishi_archers_flavor: "#F Balhae inherited the ancient #italic kushishi#! stone-tipped arrows of the Sushen, and its bowcraft is the finest east of the sea. Amid the forest seas their arrows fall like rain, and the mountains of the Five Capitals are feathered with shafts.#!"
 balhae_riders: "Balhae Iron Riders"
 balhae_riders_flavor: "#F The Balhae court keeps the fierce Mohe horsemen as its claws, its horse affairs modeled on Tang and bred on the frontier. They charge between the woods and sweep across the plains - the war-fame of the Sea-East Prosperous Land rides on their hooves.#!"
 balhae_wujing_spearmen: "Wujing Spearmen"
 balhae_wujing_spearmen_flavor: "#F Balhae aped the Tang system with its #italic Five Capitals and Fifteen Prefectures#!, each garrison spear-and-mail arrayed. The picked infantry of Sanggyeong Longquan hold the spear walls that guard the royal city and the vital roads.#!"
 mohe_hunters: "Mohe Hunters"
 mohe_hunters_flavor: "#F The Mohe tribes live by the hunt and the catch, and their men learn the ways of forest and snow from childhood. Their arrows and their knowledge of the game trails make invaders vanish in the depths of the dark woods.#!"
 mohe_warriors: "Mohe Warriors"
 mohe_warriors_flavor: "#F The Sui histories say of the Mohe that #italic every man is fierce and strong#!. These stalwarts wear heavy hides and carry blade and spear, fighting in the woodlands with a fearlessness that makes them the most savage infantry of the northeastern forests.#!"
 goguryeo_horse_archers: "Goguryeo Horse Archers"
 goguryeo_horse_archers_flavor: "#F Riders who carry on the mounted archery of Goguryeo, whose skill from the saddle once amazed the hosts of the Three Kingdoms. They first cover the enemy with arrow storms from afar, then close in for the kill.#!"
 goguryeo_armored_infantry: "Goguryeo Armored Infantry"
 goguryeo_armored_infantry_flavor: "#F The mountain forts of Goguryeo once held at bay the million-strong armies of Sui and Tang. Its armored men, heavy-mailed with long weapons in hand, are the last martial bone of the old order of Wandu and Pyeongyang.#!"
 jurchen_heavy_infantry: "Jurchen Heavy Infantry"
 jurchen_heavy_infantry_flavor: "#F The Jurchen clans of Yingzhou are few, yet their armored warriors already show the seed of the later Meng'an and Mouke. Heavy-mailed, moving with discipline through the forests, they are a portent of the rise of the northeastern tribes.#!"
 # South China 867 Elite MaA
 viet_crossbowmen: "Jiaozhi Crossbowmen"
 viet_crossbowmen_flavor: "#F In the rice plains of the Red River, the An Nam commandery kept its soldiery in the Tang manner. These crossbowmen of Jiaozhi pour disciplined volleys from the dykes and bamboo groves, and are the core of the southern frontier defense.#!"
 viet_spear_pikes: "Annian Spear Lines"
 viet_spear_pikes_flavor: "#F The infantry of the Jinghai Army formed spear walls across the river plains of the far south. Steadfast among the paddies and dykes, their serried pikes blunt the raiders of the highlands and shield the crossbow lines.#!"
 hlai_cave_archers: "Lidong Archers"
 hlai_cave_archers_flavor: "#F The Li folk of the island of Hainan dwell in the mountain caves and forests of the interior. Their archers, masters of the hunt and the ambush, defend the passes of their homeland against all comers.#!"
 tai_rattan_warriors: "Rattan Warriors"
 tai_rattan_warriors_flavor: "#F The Tai tribes of the southern river valleys weave the rattan armor that bears their name. Light and supple, it lets these skirmishers glide through the jungle, striking and vanishing among the bamboo and lianas.#!"
 bouxcuengh_crossbowmen: "Liaoren Crossbowmen"
 bouxcuengh_crossbowmen_flavor: "#F The Li-Liao folk of the western hills of Gui muster crossbowmen who know every cliff and ravine of their home ranges. Ambushes from the heights bleed invaders, while the fastness of the karst swallows pursuit.#!"
 hmong_poison_archers: "Poison Crossbowmen"
 hmong_poison_archers_flavor: "#F The Hmong of the cloud highlands are famed for their poisoned crossbow bolts, dipped in the venoms of the southern forests. One graze is enough; their shooting breaks sieges of their fastness from afar.#!"
 yao_mountain_hunters: "Mountain Hunters"
 yao_mountain_hunters_flavor: "#F The Yao folk of the southern ranges live by the hunt, and their young men are skirmishers born. They descend on camps and columns from the ridgelines, and no pursuit can catch them among the peaks.#!"
 # Tibet 867 Elite MaA
 snowfield_archers: "Snowfield Archers"
 snowfield_archers_flavor: "#F Archers of the glacier highlands, bending their short willow bows in air so thin it leaves lowlanders gasping. In the clear, cold realm of the snowfields, their arrows take life from half a mile away.#!"
 highland_ambushers: "Highland Ambushers"
 highland_ambushers_flavor: "#F Hardened sons of the deep gorges, raised on the hidden paths of the mountains. Ambush and vanish, strike and disappear - that is their way, and no invader can lay a hand on the passes of the plateau.#!"
 plateau_horsemen: "Plateau Horsemen"
 plateau_horsemen_flavor: "#F Under the Tibetan #italic Five Wings#! system, every wing kept its mounted host. Born on the high pastures, these riders mount the small, hardy horses of the plateau and appear and vanish across the mountain steppes - the thunder of the btsanpo's lingering might.#!"
 zhangzhung_riders: "Zhangzhung Riders"
 zhangzhung_riders_flavor: "#F The ancient kingdom of Zhangzhung in Ngari lived by herding, and the folk of Khyunglung Silver Castle are born horsemen. These highland riders range the foot of Mount Kailash, guarding the last glory of the Bon sacred land.#!"
 sumpa_women_warriors: "Sumpa Women Warriors"
 sumpa_women_warriors_flavor: "#F The Sui histories say of the Eastern Women's Kingdom that #italic women are honored and men held light#!. Sumpa is ruled by queens, and among its war bands are fierce women fighters, bow and shield in hand, ranging the Nagqu grasslands and valleys.#!"
 tsangpa_spearmen: "Tsangpa Spearmen"
 tsangpa_spearmen_flavor: "#F The estates of Tsang stand thick across the highland, and their peasant spearmen muster in serried ranks to guard manor and field. The spear wall before the mountain passes holds as it always has against the raiders of the north.#!"
 kirati_hunters: "Kirati Hunters"
 kirati_hunters_flavor: "#F The Kirati folk of the southern Himalaya have lived by the hunt since time immemorial, treading the ridges above the clouds. They lie in ambush among the great ranges, and armies crossing the passes bleed step by step.#!"
 lhomon_archers: "Lhomon Archers"
 lhomon_archers_flavor: "#F The hill folk of Lhoyu and Monyul have kept their passes with the bow since time out of mind. Amid dense forest and sheer cliffs, their arrows are the first greeting any outsider receives when he covets this land.#!"
