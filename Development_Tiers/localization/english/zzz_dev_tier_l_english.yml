l_english:
 dev_tier_1_modifier:0 "Wilderness"
 dev_tier_1_modifier_desc:0 "A sparsely settled backwater with little to offer."
 dev_tier_2_modifier:0 "Village"
 dev_tier_2_modifier_desc:0 "A small farming settlement, beginning to prosper."
 dev_tier_3_modifier:0 "Township"
 dev_tier_3_modifier_desc:0 "Markets and trade routes bring modest wealth to this area."
 dev_tier_4_modifier:0 "Town"
 dev_tier_4_modifier_desc:0 "A bustling town with thriving crafts and commerce. Roads converge here, making travel safer."
 dev_tier_5_modifier:0 "County Seat"
 dev_tier_5_modifier_desc:0 "A wealthy seat of local administration, ringed by walls. Prosperity comes with growing pains: county control erodes more easily here."
 dev_tier_6_modifier:0 "Metropolis"
 dev_tier_6_modifier_desc:0 "A great metropolis whose riches feed a realm, with towering walls and an ample pool of recruits. Land is expensive and the urban way of life takes its toll."
 dev_tier_7_modifier:0 "Imperial Capital"
 dev_tier_7_modifier_desc:0 "One of the greatest cities of the world, a fortress of gold and stone with a full war chest of manpower. Its splendor is unrivaled, but its upkeep is a burden."
 dev_siege_razed_modifier:0 "Sacked"
 dev_siege_razed_modifier_desc:0 "This county was taken by storm. The sack devastated its economy and development."
 dev_tier_siege_loss_toast:0 "[county.GetName] has fallen! The sack has ravaged its development."
