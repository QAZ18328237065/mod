l_simp_chinese:
 dev_tier_1_modifier:0 "荒野"
 dev_tier_1_modifier_desc:0 "一片人烟稀少的穷乡僻壤，乏善可陈。"
 dev_tier_2_modifier:0 "村庄"
 dev_tier_2_modifier_desc:0 "一座小小的农耕聚落，开始兴旺起来。"
 dev_tier_3_modifier:0 "乡"
 dev_tier_3_modifier_desc:0 "集市与商路为这片土地带来可观的财富。"
 dev_tier_4_modifier:0 "镇"
 dev_tier_4_modifier_desc:0 "一座繁华的市镇，手工业与商贸兴盛。商路贯通，车马辐辏，行旅更加安全。"
 dev_tier_5_modifier:0 "县"
 dev_tier_5_modifier_desc:0 "一方富庶的地方治所，城墙环绕。繁荣伴随成长的烦恼：这里的控制度更易流失。"
 dev_tier_6_modifier:0 "郡城"
 dev_tier_6_modifier_desc:0 "一座供养整个王国的大都会，城墙高耸、兵源充足。地价昂贵，都邑虚其户口。"
 dev_tier_7_modifier:0 "京城"
 dev_tier_7_modifier_desc:0 "天下屈指可数的巨都之一，金城汤池、军府充盈。繁华无与伦比，而维系其运转亦是沉重的负担。"
 dev_siege_razed_modifier:0 "破城"
 dev_siege_razed_modifier_desc:0 "此城遭强攻陷落。洗劫摧毁了当地的经济与发展。"
 dev_tier_siege_loss_toast:0 "[county.GetName]陷落！洗劫重创了它的发展度。"
