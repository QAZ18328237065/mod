# [DEV TIER] Tiger 误报过滤
# 说明：army_on_actions.txt 与 yearly_on_actions.txt 是从原版整体复制的文件，
# Tiger 在 mod 上下文中对原版内容重校验产生 strict-scopes/temporary-scope 等误报
# （原版游戏正常加载）。仅对这两个复制文件忽略误报键，mod 自建文件检测完整保留。
languages = {
	check = "simp_chinese"
	check = "english"
}
filter = {
	show_vanilla = no
	show_loaded_mods = no
	trigger = {
		ignore_keys_in_files = {
			keys = {
				strict-scopes
				temporary-scope
				unknown-list
				scopes
				use-of-this
			}
			files = {
				common/on_action/army_on_actions.txt
				common/on_action/yearly_on_actions.txt
			}
		}
	}
}
