l_simp_chinese:
 zzz_subjugated_tributary_rebellion_subjugation.0001.t:0 "朝贡者挣脱枷锁"
 zzz_subjugated_tributary_rebellion_subjugation.0001.desc:0 "[wayward.GetShortUIName|U] 挣脱了你的枷锁，一声不吭便断绝了朝贡。消息在宫廷中传开——连一个朝贡者的叛逃都追不回来的宗主，还能有什么威信？\n\n#bold 你打算如何回应？#!"
 zzz_subjugated_tributary_rebellion_subjugation.0001.a:0 "立即出兵讨伐——以武力夺回应得之物"
 zzz_subjugated_tributary_rebellion_subjugation.0001.b:0 "随他们去吧，不值得为此流血"
 zzz_subjugated_tributary_rebellion_subjugation.0001.c:0 "杀鸡儆猴——让其余朝贡者看看背叛的下场"
 zzz_subjugated_tributary_rebellion_subjugation.0002.t:0 "宗主更替"
 zzz_subjugated_tributary_rebellion_subjugation.0002.desc:0 "旧主已逝，[suzerain.GetShortUIName|U]如今执掌你的朝贡关系。但你并非自愿臣服于这新面孔——反抗的种子已经埋下。\n\n你可以即刻断绝朝贡，或静观其变。"
 zzz_subjugated_tributary_rebellion_subjugation.0002.a:0 "暂且隐忍，静观其变"
 zzz_subjugated_tributary_rebellion_subjugation.0002.b:0 "我拒绝向新主低头！（立即断绝朝贡）"
 zzz_subjugated_tributary_rebellion_subjugation.0003.t:0 "被继承的枷锁"
 zzz_subjugated_tributary_rebellion_subjugation.0003.desc:0 "被征服的枷锁落在了你身上——[suzerain.GetShortUIName|U] 凭武力与你建立了被征服朝贡关系。无论它是继承而来还是刚刚确立，这枷锁都是真实的。\n\n你可以暂且隐忍，也可以即刻断绝朝贡。"
 zzz_subjugated_tributary_rebellion_subjugation.0003.a:0 "暂且隐忍"
 zzz_subjugated_tributary_rebellion_subjugation.0003.b:0 "绝不！立刻断绝朝贡"
 subjugated_tributary_rebellion_resent_new_suzerain_opinion:0 "怨恨新宗主"
 subjugated_tributary_rebellion_resent_new_suzerain_opinion_desc:0 "他们是被迫臣服于新宗的，谈不上半点忠诚。"
 subjugated_tributary_rebellion_plt_suzerain_opinion:0 "为新宗主所安抚"
 subjugated_tributary_rebellion_plt_suzerain_opinion_desc:0 "新宗主的算计与姿态赢得了他们的认可。"
 subjugated_tributary_rebellion_suzerain_aggression_opinion:0 "畏惧宗主的好战"
 subjugated_tributary_rebellion_suzerain_aggression_opinion_desc:0 "一个连叛逃朝贡者都敢追杀的宗主，未必不会把刀架在他们脖子上。"
 subjugated_tributary_rebellion_intimidated_opinion:0 "受宗主威慑"
 subjugated_tributary_rebellion_intimidated_opinion_desc:0 "宗主的雷霆手段让他们噤若寒蝉。"
 subjugated_tributary_rebellion_untrustworthy_opinion:0 "叛乱败者"
 subjugated_tributary_rebellion_untrustworthy_opinion_desc:0 "他们曾举兵反抗却一败涂地，再难获得信任。"
 subjugated_tributary_rebellion_soothe_rebel_interaction:0 "安抚不安的朝贡者"
 subjugated_tributary_rebellion_soothe_rebel_interaction_desc:0 "赠以厚礼、示以宽仁，令其反抗就此平息。反抗期立即结束，他们对你的好感上升。"
 subjugated_tributary_rebellion_deter_rebel_interaction:0 "杀鸡儆猴"
 subjugated_tributary_rebellion_deter_rebel_interaction_desc:0 "让他们见识铁拳。反抗期缩短为一年，但他们将因此怨恨你。"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation:0 "强制参战义务"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_none:0 "无$zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation$"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_none_desc:0 "#flavor 朝贡者不会自动加入你的战争。#!"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_none_short:0 "无"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_forced:0 "强制$zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation$"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_forced_desc:0 "#emphasis #bold 宗主特权：#!#!\n朝贡者必须加入你的战争并为你而战。#!"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_forced_short:0 "强制"
 subjugated_tributary_rebellion_retaliation_cb:0 "收复朝贡者战争"
 SUBJUGATED_TRIBUTARY_REBELLION_RETALIATION_CB_NAME:0 "收复朝贡者"
 SUBJUGATED_TRIBUTARY_REBELLION_RETALIATION_WAR_NAME:0 "收复$PROVINCE$"
 SUBJUGATED_TRIBUTARY_REBELLION_RETALIATION_WAR_NAME_BASE:0 "$PROVINCE$收复战争"
 subjugated_tributary_rebellion_retaliation_cb_victory_desc:0 "叛逃者被迫重新低头。"
 subjugated_tributary_rebellion_retaliation_cb_victory_desc_attacker:0 "你的大军碾碎了叛乱。[defender.GetShortUIName|U] 将重新向你进贡。"
 subjugated_tributary_rebellion_retaliation_cb_victory_desc_defender:0 "你的大军被碾碎，你必须重新履行朝贡。"
 subjugated_tributary_rebellion_retaliation_cb_white_peace_desc:0 "战争无果而终，叛逃者依旧自由。"
 subjugated_tributary_rebellion_retaliation_cb_white_peace_desc_defender:0 "战争无果而终，你依旧自由。"
 subjugated_tributary_rebellion_retaliation_cb_defeat_desc_attacker:0 "你的大军未能让叛逃者低头。"
  subjugated_tributary_rebellion_revenge_rival_reason:0 "背弃朝贡的叛徒"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated:0 "朝贡者和平敕令"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_allowed:0 "允许内斗"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_allowed_desc:0 "#flavor 该朝贡者可与同宗主国的其他被征服朝贡者开战。#!"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_allowed_short:0 "允许"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_forbidden:0 "禁止内斗"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_forbidden_desc:0 "#emphasis #bold 宗主特权：#!#!\n该朝贡者不得对同宗主国的其他被征服朝贡者宣战。朝贡者对此限制心怀怨恨。#!"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_forbidden_short:0 "禁止"
  subjugated_tributary_rebellion_enforce_peace_interaction:0 "颁下朝贡者和平敕令"
  subjugated_tributary_rebellion_enforce_peace_interaction_desc:0 "禁止此被征服朝贡者对你其他被征服朝贡者开战。他们将心怀怨恨，反抗之心可能滋长。"
  subjugated_tributary_rebellion_relax_peace_interaction:0 "解除和平敕令"
  subjugated_tributary_rebellion_relax_peace_interaction_desc:0 "允许此被征服朝贡者再次对你其他被征服朝贡者开战。"
  subjugated_tributary_rebellion_peace_dividend:0 "和平红利"
  subjugated_tributary_rebellion_peace_dividend_desc:0 "被宗主禁止开战，他们得以享受安宁的和平：军队休整、经济繁荣。"
  subjugated_tributary_rebellion_enforce_war_obligation_interaction:0 "要求强制参战"
  subjugated_tributary_rebellion_enforce_war_obligation_interaction_desc:0 "要求此被征服朝贡者加入你的战争。他们将对此义务心怀不满。"
  subjugated_tributary_rebellion_relax_war_obligation_interaction:0 "解除强制参战"
  subjugated_tributary_rebellion_relax_war_obligation_interaction_desc:0 "解除此被征服朝贡者加入你战争的义务。"
