l_english:
 zzz_subjugated_tributary_rebellion_subjugation.0001.t:0 "A Tributary Has Broken Its Bonds"
 zzz_subjugated_tributary_rebellion_subjugation.0001.desc:0 "[wayward.GetShortUIName|U] has cast off your yoke, ceasing tribute without a word of warning. The news spreads through your court — what kind of suzerain lets a tributary simply walk away?\n\nYou have choices to make.#bold How will you respond?#!"
 zzz_subjugated_tributary_rebellion_subjugation.0001.a:0 "March on them at once — reclaim our due by force"
 zzz_subjugated_tributary_rebellion_subjugation.0001.b:0 "Let them go. It is not worth the blood"
 zzz_subjugated_tributary_rebellion_subjugation.0001.c:0 "Make an example of them — let the rest see what treason earns"
 zzz_subjugated_tributary_rebellion_subjugation.0002.t:0 "A Change of Suzerain"
 zzz_subjugated_tributary_rebellion_subjugation.0002.desc:0 "Your old suzerain has passed, and [suzerain.GetShortUIName|U] now commands your tribute. But you did not kneel before this new face willingly — the seeds of defiance are sown.\n\nYou may cease your tribute at once, or bide your time."
 zzz_subjugated_tributary_rebellion_subjugation.0002.a:0 "Bide my time for now"
 zzz_subjugated_tributary_rebellion_subjugation.0002.b:0 "I refuse to bow to a new master!#weak (Cease paying tribute immediately)"
 zzz_subjugated_tributary_rebellion_subjugation.0003.t:0 "An Inherited Yoke"
 zzz_subjugated_tributary_rebellion_subjugation.0003.desc:0 "The yoke of subjugation falls upon you: [suzerain.GetShortUIName|U] holds you through a conquered tributary contract, won by the sword. Whether inherited or renewed, the bond is real.\n\nYou may quietly accept it for now, or sever the bond at once."
 zzz_subjugated_tributary_rebellion_subjugation.0003.a:0 "Accept it, for now"
 zzz_subjugated_tributary_rebellion_subjugation.0003.b:0 "Never! Cease paying tribute"
 subjugated_tributary_rebellion_resent_new_suzerain_opinion:0 "Resents the New Suzerain"
 subjugated_tributary_rebellion_resent_new_suzerain_opinion_desc:0 "They were forced into submission, and hold no loyalty for this new liege."
 subjugated_tributary_rebellion_plt_suzerain_opinion:0 "Appeased by the New Suzerain"
 subjugated_tributary_rebellion_plt_suzerain_opinion_desc:0 "The new suzerain's measures have won their grudging respect."
 subjugated_tributary_rebellion_suzerain_aggression_opinion:0 "Fears My Warlike Ways"
 subjugated_tributary_rebellion_suzerain_aggression_opinion_desc:0 "A suzerain who marches on runaway tributaries will not hesitate to march on them."
 subjugated_tributary_rebellion_intimidated_opinion:0 "Intimidated by the Suzerain"
 subjugated_tributary_rebellion_intimidated_opinion_desc:0 "The suzerain's harsh display has left them cowed."
 subjugated_tributary_rebellion_untrustworthy_opinion:0 "A Defeated Rebel"
 subjugated_tributary_rebellion_untrustworthy_opinion_desc:0 "They rose in rebellion and failed. They cannot be trusted again."
 subjugated_tributary_rebellion_soothe_rebel_interaction:0 "Soothe Restless Tributary"
 subjugated_tributary_rebellion_soothe_rebel_interaction_desc:0 "Offer gifts and leniency to end their defiance. The rebellion will end at once, and their opinion of you will improve."
 subjugated_tributary_rebellion_deter_rebel_interaction:0 "Show Them the Iron Fist"
 subjugated_tributary_rebellion_deter_rebel_interaction_desc:0 "Show them the iron fist. Their defiance will be shortened to a year, but they will resent you for it."
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation:0 "Forced War Support"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_none:0 "No $zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation$"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_none_desc:0 "#flavor The [tributary|E] will not automatically join your wars.#!"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_none_short:0 "None"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_forced:0 "Forced $zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation$"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_forced_desc:0 "#emphasis #bold [suzerain|E] Privilege:#!#!\nThe [tributary|E] must join your wars and support your cause on the battlefield.#!"
 zzz_subjugated_tributary_rebellion_tributary_war_participation_obligation_forced_short:0 "Forced"
 subjugated_tributary_rebellion_retaliation_cb:0 "Reclaim Tributary War"
 SUBJUGATED_TRIBUTARY_REBELLION_RETALIATION_CB_NAME:0 "Reclaim Tributary"
 SUBJUGATED_TRIBUTARY_REBELLION_RETALIATION_WAR_NAME:0 "Reclaim $PROVINCE$"
 SUBJUGATED_TRIBUTARY_REBELLION_RETALIATION_WAR_NAME_BASE:0 "$PROVINCE$ Reclamation War"
 subjugated_tributary_rebellion_retaliation_cb_victory_desc:0 "The defector has been forced back under the yoke."
 subjugated_tributary_rebellion_retaliation_cb_victory_desc_attacker:0 "Your armies have crushed the rebellion. [defender.GetShortUIName|U] will pay tribute once more."
 subjugated_tributary_rebellion_retaliation_cb_victory_desc_defender:0 "Your armies have been crushed. You must resume paying tribute."
 subjugated_tributary_rebellion_retaliation_cb_white_peace_desc:0 "The war ends without a clear victor. The defector remains free."
 subjugated_tributary_rebellion_retaliation_cb_white_peace_desc_defender:0 "The war ends without a clear victor. You remain free."
 subjugated_tributary_rebellion_retaliation_cb_defeat_desc_attacker:0 "Your army has failed to bring the defector to heel."
  subjugated_tributary_rebellion_revenge_rival_reason:0 "Cast off their tribute"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated:0 "Decree of Peace Among Subjugated"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_allowed:0 "Wars Allowed"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_allowed_desc:0 "#flavor The [tributary|E] may wage war against other subjugated [tributaries|E] of the same [suzerain|E].#!"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_allowed_short:0 "Allowed"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_forbidden:0 "Wars Forbidden"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_forbidden_desc:0 "#emphasis #bold [suzerain|E] Privilege:#!#!\nThe [tributary|E] may not declare war on other subjugated [tributaries|E] of the same [suzerain|E]. The [tributary|E] resents the restriction.#!"
  zzz_subjugated_tributary_rebellion_peace_among_subjugated_forbidden_short:0 "Forbidden"
  subjugated_tributary_rebellion_enforce_peace_interaction:0 "Decree Peace Among Subjugated"
  subjugated_tributary_rebellion_enforce_peace_interaction_desc:0 "Forbid this subjugated tributary from waging war on your other subjugated tributaries. They will resent the restriction, and their defiance may grow."
  subjugated_tributary_rebellion_relax_peace_interaction:0 "Lift the Decree of Peace"
  subjugated_tributary_rebellion_relax_peace_interaction_desc:0 "Allow this subjugated tributary to wage war on your other subjugated tributaries once more."
  subjugated_tributary_rebellion_peace_dividend:0 "Peace Dividend"
  subjugated_tributary_rebellion_peace_dividend_desc:0 "Forbidden from waging war by their suzerain, they enjoy a quiet peace: armies rest and the economy prospers."
  subjugated_tributary_rebellion_enforce_war_obligation_interaction:0 "Demand Forced War Support"
  subjugated_tributary_rebellion_enforce_war_obligation_interaction_desc:0 "Require this subjugated tributary to join your wars. They will resent the obligation."
  subjugated_tributary_rebellion_relax_war_obligation_interaction:0 "Lift Forced War Support"
  subjugated_tributary_rebellion_relax_war_obligation_interaction_desc:0 "Release this subjugated tributary from the obligation to join your wars."
