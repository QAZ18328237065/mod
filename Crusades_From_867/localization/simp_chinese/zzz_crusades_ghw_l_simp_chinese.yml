l_simp_chinese:
 zzz_crusades_ghw.0002.t:0 "圣战之火已燃遍世界"
 zzz_crusades_ghw.0002.desc_ready:0 "随着时代更迭，圣战的火焰已在 [faith.GetName|U] 的信徒心中燃起。你的信仰教义合法、狂热高涨、信徒众多——大圣战之门已向你敞开。\n\n只要出现值得讨伐的目标，你便可发动属于你自己的圣战。"
 zzz_crusades_ghw.0002.desc_general:0 "大圣战时代已经开启。无论何种宗教——只要教义合法、拥有宗教领袖、狂热高涨、信徒规模可观——都可以发动大圣战（十字军、吉哈德、大净化等）。\n\n若你的信仰暂时不具备条件，可以通过改革信仰或创建新信仰来满足教义要求。"
 zzz_crusades_ghw.0002.a:0 "明白了"
